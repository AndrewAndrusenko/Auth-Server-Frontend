<div class="process-state" *ngIf="processState">
  <label >{{processState}}</label>
  <mat-progress-bar mode="query"></mat-progress-bar>
</div>
<label
  class="registerResultMessage__text" 
  *ngIf="result!=='null'" ngClass="{{result}}" >
  {{result==='success'? 'Success: Your email address has been confirmed!':'Error: Email has not been confirmed!'}}
</label>
<br><br>
<button mat-flat-button class="common-action-button" routerLink="/register" >Back to Log In page</button>
