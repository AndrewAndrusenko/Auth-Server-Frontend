<input class="filter-mobile" matInput  placeholder="Search..." [formControl]="filterControl" type="search" >
  <mat-form-field  class = "filter-field"  title="Filter All columns">
    <mat-label>Type to search...</mat-label>
    <input matInput  matTooltip="Use context menu to add filter"  [formControl]="filterControl" />
    <button matSuffix  mat-icon-button aria-label="Clear" (click)="filterControl.patchValue('')" >
      <mat-icon>close</mat-icon>
    </button>
  </mat-form-field>
  <button  mat-raised-button title="Export To Excel"
  class="common-action-button"
        (click)="exportToExcel()">
    Save as XLS 
    <mat-icon matSuffix >save_alt</mat-icon>
  </button>
  <button mat-raised-button title="Reload Table"
  class="common-action-button"
    (click)="reloadTable()">
    Reload 
    <mat-icon matSuffix >refresh</mat-icon>
  </button>
  <button  mat-raised-button [disabled]="disabledControlElements" *ngIf="actionsForTable.includes('Create')"
  class="common-action-button"
     matTooltip="Create Transaction Type"
    (click)="initAction('Create',null)">
    Create item 
    <mat-icon matSuffix >add_circle</mat-icon>
  </button>
  <!-- complexSearch Form -->
   <div class="table-container">
 <table  mat-table [dataSource]="dataSource" multiTemplateDataRows matSort     >
    <ng-container matColumnDef="{{column}}" *ngFor="let column of columnsToDisplay; let i=index" justify="right"  >
      <th mat-header-cell *matHeaderCellDef mat-sort-header> {{columnsHeaderToDisplay[i]}}</th>
      <td 
        mat-cell *matCellDef="let element" [cdkContextMenuTriggerFor]="instrumentcontextmenu" >
        <span [ngSwitch]="true==true">
          <p *ngSwitchDefault>{{element[column]!=='null'? element[column]:''}}</p>
          <p  *ngSwitchCase="['action'].includes(column) " >
            <button  mat-icon-button class="mobile-buttons"
              matTooltip="Actions"    [cdkMenuTriggerFor]="instrumentcontextmenu"       >
              <mat-icon >more_vert</mat-icon>
            </button>
            <button  *ngIf="disabledControlElements&&actionsForTable.includes('View')" mat-icon-button class="desktop-buttons"
              matTooltip="View"    (click)="initAction('View', element)"          >
              <mat-icon >pageview</mat-icon>
            </button>
            <ng-container  *ngIf="!disabledControlElements" >
              <button mat-icon-button *ngIf="actionsForTable.includes('Edit')" class="desktop-buttons"
                matTooltip="Edit"
                (click)="initAction('Edit',element)">
                <mat-icon >edit</mat-icon>
              </button>
              <button mat-icon-button *ngIf="actionsForTable.includes('Create_Example')" class="desktop-buttons"
                matTooltip="Copy"
                (click)="initAction('Create_Example',element)">
                <mat-icon >file_copy</mat-icon>
              </button>
              <button *ngIf="actionsForTable.includes('Delete')" class="desktop-buttons"
                mat-icon-button 
                matTooltip="Delete"
                (click)="initAction('Delete',element)">
                <mat-icon >delete</mat-icon>
              </button>
            </ng-container>
          </p>
        </span>
        <ng-template  #instrumentcontextmenu>
          <div class="menu-context mat-elevation-z4" cdkMenu  >
            <button 
              (click)="updateFilter(element[column])"
              class="menu-context-item" cdkMenuItem>
              <mat-icon class="menu-context-item-icon" matPrefix>filter_list</mat-icon> 
              Add to filter
            </button> 
            <ng-container  *ngIf="!disabledControlElements">
              <button *ngIf="actionsForTable.includes('Edit')"
                class="menu-context-item" cdkMenuItem
                (click)="initAction('Edit',element)">
                <mat-icon class="menu-context-item-icon" matPrefix>edit</mat-icon>
                Edit 
              </button>
              <button *ngIf="actionsForTable.includes('Create_Example')"
                class="menu-context-item" cdkMenuItem
                (click)="initAction('Create_Example',element)">
                <mat-icon class="menu-context-item-icon" matPrefix>file_copy</mat-icon>
                Copy 
              </button>
              <button *ngIf="actionsForTable.includes('Delete')"
                class="menu-context-item" cdkMenuItem
                (click)="initAction('Delete',element)">
                <mat-icon class="menu-context-item-icon" matPrefix>delete</mat-icon>
                Delete 
              </button>
            </ng-container>
          </div>
        </ng-template>  
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
    <tr mat-row  *matRowDef="let element; columns: columnsToDisplay; let dataindex=dataIndex;"
      tabindex=0   >
    </tr>
  </table>
  <mat-paginator></mat-paginator>
</div>
